# Generated by scripts/toolkit/install.php when absent.
# Edit locally when the project needs custom service wiring.

parameters:
  project_root: '%kernel.project_dir%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Sowapps\Toolkit\Client\ConsoleClientInterface: '@Sowapps\Toolkit\Client\ConsoleClient'
  Sowapps\Toolkit\Client\FilesystemClientInterface: '@Sowapps\Toolkit\Client\FilesystemClient'
  Sowapps\Toolkit\Client\GitClientInterface: '@Sowapps\Toolkit\Client\GitClient'
  Symfony\Contracts\HttpClient\HttpClientInterface: '@http_client'

  'Sowapps\Toolkit\':
    resource: '../../web-toolkit/src/'
    exclude:
      - '../../web-toolkit/src/bootstrap.php'

  'Sowapps\Backlog\':
    resource: '../../web-backlog/src/'
    exclude:
      - '../../web-backlog/src/bootstrap.php'

  'Sowapps\SoManAgent\Script\':
    resource: '../scripts/src/'
    exclude:
      - '../scripts/src/bootstrap.php'
