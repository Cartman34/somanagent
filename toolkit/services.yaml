# Generated by scripts/toolkit/install.php when absent.
# Edit locally when the project needs custom service wiring.

services:
  _defaults:
    autowire: true
    autoconfigure: true

  'Sowapps\Toolkit\':
    resource: '../../web-toolkit/src/'
    exclude:
      - '../../web-toolkit/src/bootstrap.php'
      # Consumable test doubles (FilesystemClientMock, FakeDockerComposeClient) ship under src/Test/
      # but must stay out of service discovery: registering them adds a second implementation of the
      # client interfaces, which breaks autowiring (the interface can no longer be aliased uniquely).
      - '../../web-toolkit/src/Test/'

  'Sowapps\Backlog\':
    resource: '../../web-backlog/src/'
    exclude:
      - '../../web-backlog/src/bootstrap.php'
      - '../../web-backlog/src/Test/'

  # File-backed ConfigValues: lazy services built by the generic ConfigFactory from their dedicated
  # converter. Declared explicitly so they are not treated as plain autowired services (their
  # constructors take raw arrays, which autowiring cannot satisfy).
  Sowapps\Backlog\Config\BoardArrayConverterInterface:
    alias: Sowapps\Backlog\Config\BoardArrayConverter

  Sowapps\Backlog\Config\AgentModelMapping:
    factory: ['@Sowapps\Toolkit\Config\ConfigFactory', 'load']
    arguments: ['@Sowapps\Backlog\Config\AgentModelMappingConverter']

  Sowapps\Backlog\Config\AgentLaunchPrompts:
    factory: ['@Sowapps\Toolkit\Config\ConfigFactory', 'load']
    arguments: ['@Sowapps\Backlog\Config\AgentLaunchPromptsConverter']

  'Sowapps\SoManAgent\Script\':
    resource: '../scripts/src/'
    exclude:
      - '../scripts/src/bootstrap.php'

  # Inject the toolkit DockerCompose base type, resolved to the SoManAgent concrete context.
  Sowapps\Toolkit\Docker\DockerCompose: '@Sowapps\SoManAgent\Script\Client\Docker\SoManAgentDockerCompose'
