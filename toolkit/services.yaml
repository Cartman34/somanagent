# Generated by scripts/toolkit/install.php when absent.
# Edit locally when the project needs custom service wiring.

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Toolkit and backlog service declarations (their package resources, config factories and the
  # board converter alias) are inherited through the service inheritance chain from each package's
  # own toolkit/services.yaml, host last. Only SoManAgent-specific wiring is declared here.

  'Sowapps\SoManAgent\Script\':
    resource: '../scripts/src/'
    exclude:
      - '../scripts/src/bootstrap.php'

  # Inject the toolkit DockerCompose base type, resolved to the SoManAgent concrete context.
  Sowapps\Toolkit\Docker\DockerCompose: '@Sowapps\SoManAgent\Script\Client\Docker\SoManAgentDockerCompose'
